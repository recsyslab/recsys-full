[dataset]
data_path=data/
users_csv=users.csv
movies_csv=movies.csv
genres_csv=genres.csv
movies_genres_csv=movies_genres.csv
ratings_csv=ratings.csv
[local]
local_path=local/
dataset_name=ml-ls
rating_matrix_csv=rating_matrix.csv
movies_movies_similarity_matrix_csv=movies_movies_similarity_matrix.csv
[setting]
config_yaml=src/config.yaml
update_rating_matrix=on
update_movies_movies_similarity_matrix=on
update_atomic=on
popularity_recommender=on
movie_similarity_recommender=on
bpr_recommender=on
[reclist]
reclist_popularity_csv=reclist_popularity.csv
reclist_movie_similarity_csv=reclist_movie_similarity.csv
reclist_bpr_csv=reclist_bpr.csv
